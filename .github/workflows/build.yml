name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KUDUSYNC/KUDUSYNC.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart('v', 'V') }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Is this a new version?
        id: rel
        shell: pwsh
        run: |
          # A push to main whose version has no tag yet gets a release of its own.
          $new = "false"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | Out-Null
            if ($LASTEXITCODE -eq 2) { $new = "true" }
            elseif ($LASTEXITCODE -ne 0) { Write-Host "Couldn't check the tags (exit code $LASTEXITCODE); no release this time." }
          }
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "New release: $new"
          $global:LASTEXITCODE = 0

      - name: Test the core logic
        shell: pwsh
        run: dotnet run --project tests/KUDUSYNC.Tests -c Release

      - name: Build
        shell: pwsh
        run: dotnet build src/KUDUSYNC/KUDUSYNC.csproj -c Release "-p:Version=${{ steps.ver.outputs.version }}" -o out/KUDUSYNC

      - name: Self-test the app (real syncs, virtual USB drives, a share, Task Scheduler, the tray, every screen)
        shell: pwsh
        timeout-minutes: 16
        run: |
          $p = Start-Process -FilePath out/KUDUSYNC/KUDUSYNC.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(840000)) { $p.Kill(); Write-Host "Self-test timed out"; exit 1 }
          Get-Content out/KUDUSYNC/self-test.log -ErrorAction SilentlyContinue
          Remove-Item out/KUDUSYNC/self-test.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "Self-test failed with exit code $($p.ExitCode)"; exit 1 }

      - name: Keep the screenshots the self-test took
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: KUDUSYNC-screenshots-${{ steps.ver.outputs.version }}
          path: out/KUDUSYNC/screenshots/*.png
          if-no-files-found: warn

      - name: Leave the screenshots out of the app
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force out/KUDUSYNC/screenshots -ErrorAction SilentlyContinue

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse out/KUDUSYNC | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # The marker file makes the portable copy keep its pairs and logs in a Data folder beside it.
          Copy-Item -Recurse out/KUDUSYNC out/portable
          Set-Content out/portable/KUDUSYNC.portable "KUDUSYNC keeps its pairs and logs in the Data folder next to it. Delete this file to use %LOCALAPPDATA%\KUDUSYNC instead."
          Compress-Archive -Path out/portable/* -DestinationPath "artifacts/KUDUSYNC-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\out\KUDUSYNC" "/O$PWD\artifacts" installer\KUDUSYNC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build files
        uses: actions/upload-artifact@v6
        with:
          name: KUDUSYNC-${{ steps.ver.outputs.version }}
          path: artifacts/*

      - name: Add a copy of the installer without the version in its name
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        shell: pwsh
        run: Copy-Item "artifacts/KUDUSYNC-${{ steps.ver.outputs.version }}-setup.exe" "artifacts/KUDUSYNC-setup.exe"

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = (Get-ChildItem artifacts/*).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber }
          else { gh release create $tag $files --target "${{ github.sha }}" --title "KUDUSYNC ${{ steps.ver.outputs.version }}" --generate-notes }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Give the latest release a copy of the installer without the version in its name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.new != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README's download button links to releases/latest/download/KUDUSYNC-setup.exe.
          $json = gh release view --json tagName,assets 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $json) { Write-Host "No release yet."; $global:LASTEXITCODE = 0; exit 0 }
          $latest = $json | ConvertFrom-Json
          $names = @($latest.assets | ForEach-Object { $_.name })
          if ($names -contains "KUDUSYNC-setup.exe") { Write-Host "$($latest.tagName) already has KUDUSYNC-setup.exe."; exit 0 }
          $versioned = $names | Where-Object { $_ -like "KUDUSYNC-*-setup.exe" } | Select-Object -First 1
          if (-not $versioned) { Write-Host "$($latest.tagName) has no installer."; exit 0 }
          New-Item -ItemType Directory -Force latest | Out-Null
          gh release download $latest.tagName --pattern $versioned --dir latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "latest/$versioned" latest/KUDUSYNC-setup.exe
          gh release upload $latest.tagName latest/KUDUSYNC-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
